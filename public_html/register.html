<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Maze Bank — create a new account" />
  <title>Create Account | Maze Bank</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230F2A5C'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='18' font-weight='700' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<main class="auth-page">
  <div class="auth-card">

    <div style="text-align:center; margin-bottom:24px;">
      <div class="auth-logo">
        <span class="auth-logo-icon">M</span>
        Maze Bank
      </div>
      <p class="auth-subtitle">Create a new account</p>
    </div>

    <div id="registerAlert" class="alert" role="alert" aria-live="polite" hidden></div>

    <form id="registerForm" aria-label="Create Account">
      <div class="form-group">
        <label class="form-label" for="regUsername">Username</label>
        <input
          id="regUsername"
          name="username"
          type="text"
          class="form-input"
          placeholder="Choose a username"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="regPassword">Password</label>
        <input
          id="regPassword"
          name="password"
          type="password"
          class="form-input"
          placeholder="At least 6 characters"
          autocomplete="new-password"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="regConfirmPassword">Confirm Password</label>
        <input
          id="regConfirmPassword"
          name="confirmPassword"
          type="password"
          class="form-input"
          placeholder="Confirm your password"
          autocomplete="new-password"
          required
        />
      </div>

      <div class="form-group" style="margin-top:8px;">
        <button type="submit" class="btn btn-primary btn-block" aria-label="Create your Maze Bank account">
          <span id="registerBtnText">Create Account</span>
        </button>
      </div>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/index.html">Sign in</a>
    </div>
  </div>
</main>

<script src="/js/auth.js"></script>
</body>
</html>
