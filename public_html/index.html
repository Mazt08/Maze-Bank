<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Maze Bank — sign in to your account" />
  <title>Sign In | Maze Bank</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230F2A5C'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='18' font-weight='700' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<main class="auth-page">
  <div class="auth-card">

    <div style="text-align:center; margin-bottom:24px;">
      <div class="auth-logo">
        <span class="auth-logo-icon">M</span>
        Maze Bank
      </div>
      <p class="auth-subtitle">Sign in to your account</p>
    </div>

    <div id="loginAlert" class="alert alert-danger" role="alert" aria-live="polite" hidden></div>

    <form id="loginForm" aria-label="Sign In">
      <div class="form-group">
        <label class="form-label" for="loginUsername">Username</label>
        <input
          id="loginUsername"
          name="username"
          type="text"
          class="form-input"
          placeholder="Enter your username"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <input
          id="loginPassword"
          name="password"
          type="password"
          class="form-input"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />
      </div>

      <div class="form-group" style="margin-top:8px;">
        <button type="submit" class="btn btn-primary btn-block" aria-label="Sign in to Maze Bank">
          <span id="loginBtnText">Sign In</span>
        </button>
      </div>
    </form>

    <!-- Lab credentials box -->
    <div style="margin-top:20px; padding:14px; background:var(--bg); border:1px solid var(--border); border-radius:var(--r-sm);">
      <p style="font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); margin-bottom:8px;">
        Test Credentials
      </p>
      <ul style="list-style:none; font-size:13px; font-family:var(--mono);">
        <li style="padding:3px 0;">alice / pass123</li>
        <li style="padding:3px 0;">bob / pass456</li>
        <li style="padding:3px 0;">charlie / pass789</li>
        <li style="padding:3px 0;">admin / admin123</li>
      </ul>
    </div>

    <!-- SQLi hint box -->
    <div style="margin-top:12px; padding:14px; background:var(--danger-bg); border:1px solid rgba(139,58,58,0.2); border-radius:var(--r-sm);">
      <p style="font-size:12px; font-weight:600; color:var(--danger); margin-bottom:6px;">
        ⚠ Lab: SQL Injection Demo
      </p>
      <p style="font-size:12px; font-family:var(--mono); background:white; padding:6px 8px; border-radius:3px; margin-bottom:4px;">
        Username: <strong>admin' --</strong>&nbsp;&nbsp;Password: anything
      </p>
      <p style="font-size:11px; color:var(--text-muted);">
        This bypasses the password check via SQL comment injection.
      </p>
    </div>

    <div class="auth-footer">
      No account yet? <a href="/register.html">Create one</a>
    </div>
  </div>
</main>

<script src="/js/auth.js"></script>
</body>
</html>
