# Maze Bank Nginx Configuration with Basic Auth

upstream react_app {
    server localhost:3000;
}

upstream api_server {
    server localhost:5000;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect HTTP to HTTPS (if using SSL)
    # return 301 https://$server_name$request_uri;

    # Basic Auth credentials (htpasswd format)
    # Generate with: htpasswd -c /etc/nginx/.htpasswd lecturer
    auth_basic "Maze Bank - Authorized Access Only";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Prevent indexing by search engines
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Rate limiting for login
    location ~ ^/api/auth/login$ {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://api_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Rate limiting for general requests
    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://react_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # API routes
    location /api/ {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://api_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
    }

    location ~ ~$ {
        deny all;
    }

    # Deny access to database files
    location ~ \.(sql|sqlbak|bak|backup)$ {
        deny all;
    }
}

